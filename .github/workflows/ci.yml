name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test
        env:
          CI: true

      - name: Build
        run: pnpm run build

  # Builds the upstream C++ at the commit NOTICE names, with the strict
  # floating-point flags in tools/build-reference.mts, and compares the port
  # with it. Two compilers and two CPU families, because "the reference" is
  # only one thing if they agree.
  reference:
    name: reference (${{ matrix.runner }}, ${{ matrix.cxx }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        cxx: [g++, clang++]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned reference commit from NOTICE
        id: pin
        run: |
          set -euo pipefail
          commit="$(sed -n 's/^PROVENANCE: facebook\/ThreatExchange at \([0-9a-f]\{40\}\) .*/\1/p' NOTICE)"
          test -n "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Checkout the reference at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: facebook/ThreatExchange
          ref: ${{ steps.pin.outputs.commit }}
          path: reference
          sparse-checkout: pdq/cpp
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the reference drivers
        env:
          CXX: ${{ matrix.cxx }}
        run: node tools/build-reference.mts --source reference --out reference-bin --cxx "$CXX"

      # Unoptimised, the compiler cannot fold the cosine at compile time, so
      # this variant takes its DCT matrix from the C library at run time.
      - name: Build the reference drivers unoptimised
        env:
          CXX: ${{ matrix.cxx }}
        run: node tools/build-reference.mts --source reference --out reference-bin --cxx "$CXX" --opt=-O0 --suffix=-O0

      - name: Compare the port with the reference
        run: pnpm run test:reference
        env:
          CI: true
          PDQ_REFERENCE_BIN: reference-bin

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The binary runs directly rather than through a PR-annotation wrapper,
      # which needs the PR diff from the API and fails outright on a large PR.
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLo "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
