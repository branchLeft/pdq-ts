# The hooks every repo runs, whatever it is written in. A repo appends its own
# below — formatter, linter, test runner, shellcheck — and SYNC-1 only asserts
# that these survive.
#
# The version is pinned rather than floating because a hook set that changes
# under you rewrites files in a commit nobody reviewed.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      # Stated rather than inherited: the hook's own default has moved before,
      # and this threshold is meant to be the same number in every repo.
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: sh -c 'pnpm format'
        language: system
        files: '\.(js|mjs|ts|json|yml|yaml|md)$'
        pass_filenames: false

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: sh -c 'pnpm lint'
        language: system
        files: '\.(js|ts)$'
        pass_filenames: false

  - repo: local
    hooks:
      - id: vitest
        name: vitest
        entry: sh -c 'CI=true pnpm test'
        language: system
        files: '\.(ts|js)$'
        pass_filenames: false
